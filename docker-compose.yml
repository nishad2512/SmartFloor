
services:
  # The Node.js Application
  app:
    build: .
    container_name: mern-app
    restart: always
    env_file:
      - .env
    # We don't expose 3000 to the public, only to Nginx internally
    expose:
      - "3000"
    networks:
      - app-network

  # The Nginx Reverse Proxy
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge