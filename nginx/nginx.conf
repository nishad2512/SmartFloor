events {
    worker_connections 1024;
}

http {
    # Fix for 413 Request Entity Too Large
    client_max_body_size 10M;

    upstream node_app {
        server app:3000;
    }

    server {
        listen 80;
        server_name smartfloor.nishadmp.in;
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name smartfloor.nishadmp.in; # Replace with your IP if no domain

        # Path to the certificates (inside the container)
        ssl_certificate /etc/letsencrypt/live/smartfloor.nishadmp.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smartfloor.nishadmp.in/privkey.pem;

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}