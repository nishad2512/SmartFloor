name: CI/CD SmartFloor

on:
  push:
    branches: [ main ]

jobs:
  # PHASE 1: Continuous Integration (Testing)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test # Ensure you have a test script in package.json

  # PHASE 2: Continuous Deployment (Docker & AWS)
  deploy:
    needs: test # Only deploy if tests pass!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: nishadmp/smartfloor-test:latest

      - name: Remote SSH Deploy & Scale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/SmartFloor
            git pull origin main
            docker compose pull
            # This handles the zero-downtime rolling update
            docker compose up -d --build --scale app=3
            docker system prune -f # Cleans up old images to save AWS space